name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 brings npm 11, which writes the lock file locally; npm 10 reads it as out of sync.
          node-version: 24
          cache: npm
      - run: npm ci
      # Uniwind writes src/uniwind-types.d.ts (className typings) during a Metro build.
      - run: npx expo export --platform android --output-dir /tmp/expo-export
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
