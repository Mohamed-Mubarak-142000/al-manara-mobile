plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.almanara.background'
version = '1.0.0'

android {
  namespace 'com.almanara.background'
  defaultConfig { versionCode 1; versionName '1.0.0' }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  // Match expo-audio in SDK 57 so both players use the same Media3 runtime.
  implementation 'androidx.media3:media3-exoplayer:1.9.0'
  implementation 'androidx.media3:media3-exoplayer-hls:1.9.0'
  implementation 'androidx.media3:media3-database:1.9.0'
}
